<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111"
  >

  <title>DBX 2231 Graphic Equalizer</title>

</head>


<body>


  <div class="app">


    <!-- ===================================================
         TOP RACK
         =================================================== -->

    <div class="top-rack">

      <button
        id="saveButton"
        type="button"
      >
        SAVE
      </button>


      <button
        id="recallButton"
        type="button"
      >
        RECALL
      </button>


      <button
        id="resetButton"
        type="button"
      >
        RESET
      </button>

    </div>


    <!-- ===================================================
         DEVICE TITLE
         =================================================== -->

    <div class="device-title">

      <h1>
        DBX 2231 GRAPHIC EQUALIZER
      </h1>


      <select id="presetSelect">

        <option value="">
          SELECT PRESET
        </option>

        <option value="flat">
          FLAT
        </option>

        <option value="vocal">
          VOCAL
        </option>

        <option value="speech">
          SPEECH
        </option>

        <option value="music">
          MUSIC
        </option>

        <option value="bass">
          BASS
        </option>

      </select>


      <button
        id="applyPresetButton"
        type="button"
      >
        APPLY
      </button>

    </div>


    <!-- ===================================================
         CHANNELS
         
         PENTING:
         CH1 dan CH2 dibuat oleh equalizer.js
         
         JANGAN memasukkan CH1 / CH2 manual di sini.
         =================================================== -->

    <div class="channels-scroll">

      <section
        class="channels"
        id="channels"
      ></section>

    </div>


    <!-- ===================================================
         AUDIO ENGINE
         =================================================== -->

    <section class="audio-engine">


      <div class="audio-engine-title">
        AUDIO ENGINE
      </div>


      <div class="audio-controls">


        <!-- INPUT DEVICE -->

        <select id="inputDevice">

          <option value="">
            SELECT INPUT DEVICE
          </option>

        </select>


        <!-- REFRESH DEVICE -->

        <button
          id="refreshDevices"
          type="button"
        >
          REFRESH
        </button>


        <!-- AUDIO FILE -->

        <input
          id="audioFile"
          type="file"
          accept="audio/*"
          multiple
        />


        <!-- MICROPHONE -->

        <button
          id="micButton"
          type="button"
        >
          MICROPHONE
        </button>


        <!-- START -->

        <button
          id="startButton"
          type="button"
        >
          START
        </button>


        <!-- STOP -->

        <button
          id="stopButton"
          type="button"
        >
          STOP
        </button>

      </div>


      <!-- =================================================
           AUDIO PLAYER
           ================================================= -->

      <audio
        id="audioPlayer"
        controls
        preload="none"
      ></audio>


      <!-- =================================================
           MASTER
           ================================================= -->

      <div class="master-control">

        <div class="master-control-title">

          <span>
            MASTER OUTPUT
          </span>

          <strong id="masterValue">
            0.0 dB
          </strong>

        </div>


        <input
          id="masterGain"
          type="range"
          min="-60"
          max="12"
          step="0.5"
          value="0"
        />


        <label
          style="
            display:flex;
            align-items:center;
            gap:6px;
            margin-top:7px;
            font-size:9px;
            color:#aaa;
          "
        >

          <input
            id="muteOutput"
            type="checkbox"
          >

          MUTE OUTPUT

        </label>

      </div>


      <!-- =================================================
           STATUS
           ================================================= -->

      <div
        class="ready-status"
        id="readyStatus"
      >
        READY
      </div>

    </section>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer class="app-footer">

      DBX 2231 GRAPHIC EQUALIZER —
      31 BAND STEREO

    </footer>


  </div>


  <!-- =====================================================
       JAVASCRIPT

       URUTAN PENTING:

       1. audio-engine.js
       2. equalizer.js

       audio-engine.js menyediakan:
         updateChannelAudio()
         createAudioContext()
         startChannelTest()
         stopChannelTest()

       equalizer.js membuat:
         CH1
         CH2
         31 band
         controls
       ===================================================== -->


  <script src="js/audio-engine.js"></script>

  <script src="js/equalizer.js"></script>
  <script src="js/echo-alesis.js"></script>

</body>

</html>
