<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>DBX 2231 Graphic Equalizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="app">

    <!-- TOP HEADER -->
    <header class="top-rack">

      <div class="brand">
        <h1>GRAPHIC EQUALIZER</h1>
        <p>DUAL CHANNEL • 31 BAND • DIGITAL HARDWARE EMULATION</p>
      </div>

      <div class="top-actions">
        <!-- TOMBOL MENU KE HALAMAN ALESIS -->
        <a href="alesis.html" class="hardware-button" style="text-decoration: none; display: inline-flex; align-items: center; background: linear-gradient(180deg, #176a8d, #073246); border-color: #1abaff;">
          MENU: ECHO ALESIS
        </a>
        <button class="hardware-button" id="saveButton">SAVE</button>
        <button class="hardware-button" id="recallButton">RECALL</button>
        <button class="hardware-button" id="resetButton">RESET</button>
      </div>

    </header>

    <!-- DEVICE -->
    <section class="device-title">
      <div>
        <div class="device-name">DBX 2231</div>
        <div class="device-subtitle">DUAL CHANNEL GRAPHIC EQUALIZER</div>
      </div>

      <div class="preset-area">
        <select id="presetSelect">
          <option value="flat">FLAT</option>
          <option value="vocal">VOKAL CLEAR</option>
          <option value="live">LIVE BAND</option>
          <option value="feedback">ANTI-FEEDBACK</option>
        </select>
        <button class="hardware-button" id="applyPresetButton">APPLY PRESET</button>
      </div>
    </section>

    <!-- CHANNELS -->
    <div class="channels-scroll">
      <section class="channels" id="channels"></section>
    </div>

    <!-- AUDIO ENGINE -->
    <section class="audio-engine">
      <div class="section-title">AUDIO ENGINE</div>
      <div class="engine-grid">
        <div class="engine-box">
          <div class="engine-label">INPUT DEVICE / AUDIO FILE</div>
          <div class="engine-controls">
            <select class="hardware-select" id="inputDevice">
              <option value="">DEFAULT MICROPHONE</option>
            </select>
            <button class="hardware-button" id="refreshDevices">REFRESH</button>
          </div>
          <br />
          <input class="file-input" id="audioFile" type="file" accept="audio/*" multiple>
        </div>

        <div class="engine-box">
          <div class="engine-label">AUDIO CONTROL</div>
          <div class="engine-controls">
            <button class="hardware-button" id="micButton">MIC INPUT</button>
            <button class="hardware-button" id="startButton">START AUDIO</button>
            <button class="hardware-button" id="stopButton">STOP AUDIO</button>
          </div>
          <audio id="audioPlayer" controls style="width:100%; margin-top:10px;"></audio>
        </div>

        <div class="engine-box">
          <div class="engine-label">MASTER OUTPUT</div>
          <div class="master-row">
            <input id="masterGain" type="range" min="-30" max="0" step="0.5" value="-12" />
            <div class="master-value" id="masterValue">-12 dB</div>
          </div>
          <br />
          <button class="hardware-button" id="muteOutput">MUTE OUTPUT</button>
        </div>
      </div>
    </section>
    <!-- FOOTER -->
    <footer class="footer">
      <div>DBX 2231 WEB EMULATOR • Web Audio API</div>
      <div class="ready" id="readyStatus">READY</div>
    </footer>

  </main>

   <!-- URUTAN PEMANGGILAN SCRIPT -->
  <script src="js/audio-engine.js"></script>
  <script src="js/echo-alesis.js"></script>
  <script src="js/equalizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
