<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>DBX 2231 Graphic Equalizer & Alesis Echo</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="app">

    <!-- TOP HEADER / NAVBAR -->
    <header class="top-rack">

      <div class="brand">
        <h1>DBX 2231 & ALESIS</h1>
        <p>DIGITAL HARDWARE EMULATION</p>
      </div>

      <div class="top-actions">
        <!-- TOMBOL NAVIGASI SPA -->
        <button class="hardware-button page-button active" data-page="equalizer" type="button">
          EQUALIZER
        </button>
        <button class="hardware-button page-button" data-page="echo" type="button">
          ECHO ALESIS
        </button>
      </div>

    </header>

    <!-- KONTAINER HALAMAN DINAMIS (Dikelola oleh app.js) -->
    <div id="pageContainer"></div>

    <!-- FOOTER -->
    <footer class="footer">
      <div>DBX 2231 & ALESIS WEB EMULATOR • Web Audio API</div>
      <div class="ready" id="readyStatus">READY</div>
    </footer>

  </main>

  <!-- URUTAN PEMANGGILAN SCRIPT YANG BENAR -->
  <script src="js/audio-engine.js"></script>
  <script src="js/echo-alesis.js"></script>
  <script src="js/equalizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
