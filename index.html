<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>DBX 2231 Graphic Equalizer</title>

  <style>
    /* =========================================================
       DBX 2231 GRAPHIC EQUALIZER
       COMPLETE RESPONSIVE HARDWARE UI
       ========================================================= */

    :root {
      --bg: #080b0e;
      --panel: #171c21;
      --panel-2: #222a31;
      --panel-3: #303941;
      --border: #58636d;
      --text: #e8edf1;
      --muted: #9da8b1;

      --orange: #ff9d00;
      --orange-dark: #9d5100;

      --green: #29f56b;
      --yellow: #ffd52b;
      --red: #ff3030;
      --blue: #279cff;
      --blue-bright: #00c8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    html {
      overflow-x: hidden;
    }

    body {
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 50% -10%,
          #263b49 0%,
          #101a22 35%,
          #05090d 75%,
          #020406 100%
        );
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      color: var(--text);
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(1px);
    }

    /* =========================================================
       MAIN APP
       ========================================================= */

    .app {
      width: 100%;
      max-width: 1900px;
      margin: 0 auto;
      padding: 7px;
    }

    /* =========================================================
       TOP RACK
       ========================================================= */

    .top-rack {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      padding: 8px 14px;

      background:
        linear-gradient(
          180deg,
          #263641 0%,
          #111c24 48%,
          #080e13 100%
        );

      border: 1px solid #566a77;
      border-radius: 7px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -10px 20px rgba(0,0,0,.45),
        0 5px 15px rgba(0,0,0,.7);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;

      font-size: clamp(22px, 3vw, 42px);
      font-weight: 900;
      letter-spacing: 2px;

      text-shadow:
        0 2px 2px #000,
        0 0 8px rgba(255,255,255,.08);
    }

    .brand p {
      margin: 3px 0 0;

      color: #18b9ff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .hardware-button {
      min-height: 40px;
      padding: 8px 15px;

      border: 1px solid #687987;
      border-radius: 6px;

      background:
        linear-gradient(
          180deg,
          #34434f,
          #17222c
        );

      box-shadow:
        inset 0 1px 0 #ffffff22,
        inset 0 -2px 0 #0008;

      color: #e9f2f7;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .hardware-button:hover {
      border-color: #18bfff;

      box-shadow:
        0 0 10px rgba(0,180,255,.35),
        inset 0 1px 0 rgba(255,255,255,.15);
    }

    .hardware-button.active {
      color: #fff;

      background:
        linear-gradient(
          180deg,
          #176a8d,
          #073246
        );

      border-color: #1abaff;

      box-shadow:
        0 0 8px rgba(0,180,255,.4),
        inset 0 0 8px rgba(0,180,255,.25);
    }

    /* =========================================================
       DEVICE TITLE
       ========================================================= */

    .device-title {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-top: 9px;
      padding: 11px 16px;

      border: 1px solid #667581;
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          #263640,
          #111a21
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -5px 12px rgba(0,0,0,.35);
    }

    .device-name {
      font-size: clamp(20px, 3vw, 31px);
      font-weight: 900;
      letter-spacing: 2px;

      text-shadow: 0 2px 2px #000;
    }

    .device-subtitle {
      margin-top: 3px;

      color: #ffb62a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;

      text-shadow:
        0 0 5px rgba(255,170,0,.3);
    }

    .preset-area {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    select {
      min-height: 38px;

      padding: 7px 10px;

      border: 1px solid #687987;
      border-radius: 6px;

      background: #111a22;
      color: var(--text);
    }

    /* =========================================================
       CHANNEL SCROLL
       ========================================================= */

    .channels-scroll {
      width: 100%;
      min-width: 0;

      margin: 0;
      padding: 0;

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling: touch;

      overscroll-behavior-x: contain;
      overscroll-behavior-y: none;

      scrollbar-width: auto;
      scrollbar-color: #788792 #151c22;

      touch-action: pan-x;
    }

    /* =========================================================
       CHANNELS
       ========================================================= */

    .channels {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 10px;

      width: 100%;
      min-width: 0;

      margin-top: 9px;

      align-items: stretch;
    }

    .channel {
      position: relative;

      min-width: 0;
      width: 100%;

      padding: 10px;

      border: 1px solid #687782;
      border-radius: 7px;

      background:
        linear-gradient(
          145deg,
          #263842 0%,
          #111c24 35%,
          #0a1117 70%,
          #1b2932 100%
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -15px 25px rgba(0,0,0,.45),
        0 5px 15px rgba(0,0,0,.75);

      overflow: hidden;
    }

    /* =========================================================
       CHANNEL HEADER
       ========================================================= */

    .channel-header {
      min-height: 43px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
      margin-bottom: 9px;
      padding: 3px 7px;

      background:
        linear-gradient(
          180deg,
          #1e2d37,
          #0a1218
        );

      border: 1px solid #435966;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        inset 0 -5px 10px rgba(0,0,0,.35);
    }

    .channel-label {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: clamp(16px, 1.5vw, 22px);
      font-weight: 900;
      letter-spacing: .5px;

      text-shadow: 0 2px 2px #000;
    }

    .power-led {
      width: 20px;
      height: 20px;

      flex: 0 0 auto;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0 8%,
          #62ff9a 20%,
          #13ef51 55%,
          #07842d 100%
        );

      border: 1px solid #42ff83;

      box-shadow:
        0 0 6px #1dff61,
        0 0 18px rgba(25,255,90,.8),
        inset 0 1px 3px #fff;
    }

    .channel-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .status-light {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      min-height: 31px;

      padding: 5px 9px;

      border: 1px solid #4b606d;
      border-radius: 5px;

      background:
        linear-gradient(
          180deg,
          #202e37,
          #0a1117
        );

      color: #dce4ea;
      font-size: 10px;
      font-weight: 800;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 2px 3px #000;
    }

    .status-light::before {
      content: "";

      width: 9px;
      height: 9px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--green);
      box-shadow: 0 0 7px var(--green);
    }

    .status-light.bypass::before {
      background: var(--red);
      box-shadow: 0 0 7px var(--red);
    }

    .status-light.test::before {
      background: var(--yellow);
      box-shadow: 0 0 7px var(--yellow);
    }

    /* =========================================================
       CONTROL ROW
       ========================================================= */

    .control-row {
      display: grid;

      grid-template-columns:
        1.15fr
        .9fr
        .9fr
        1.55fr
        auto;

      gap: 7px;

      align-items: stretch;
    }

    .control-box {
      min-width: 0;
      min-height: 108px;

      padding: 8px;

      border: 1px solid #506674;
      border-radius: 6px;

      background:
        linear-gradient(
          145deg,
          #1b2a34,
          #091117
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        inset 0 -8px 15px rgba(0,0,0,.4),
        0 2px 4px rgba(0,0,0,.45);
    }

    .control-title {
      margin-bottom: 8px;

      color: #e7edf1;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .3px;

      text-shadow: 0 1px 2px #000;
      white-space: nowrap;
    }

    /* =========================================================
       GAIN
       ========================================================= */

    .gain-slider {
      width: 100%;
      height: 18px;

      cursor: pointer;
      touch-action: pan-y;
    }

    .gain-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #dce5e9 0 7%,
          #7e8a91 22%,
          #263038 58%,
          #080b0e 80%,
          #6c777d 100%
        );

      border: 1px solid #aab6bc;

      box-shadow:
        0 2px 5px #000,
        0 0 5px rgba(0,160,255,.4);
    }

    .gain-value {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 6px;
      margin-top: 4px;

      font-size: 12px;
    }

    .gain-value strong {
      font-size: 15px;
      color: #f0f3f5;
    }

    /* =========================================================
       GENERIC RANGE
       ========================================================= */

    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
      cursor: pointer;
    }

    /* =========================================================
       SMALL BUTTON
       ========================================================= */

    .small-button {
      min-height: 35px;
      min-width: 38px;

      padding: 5px 10px;

      border: 1px solid #617582;
      border-radius: 5px;

      background:
        linear-gradient(
          180deg,
          #334754,
          #101b23
        );

      color: #e9f2f7;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -3px 5px rgba(0,0,0,.45),
        0 2px 3px #000;

      font-size: 11px;
      font-weight: 900;

      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .small-button:hover {
      border-color: #14baff;
    }

    .small-button.active {
      color: #fff;

      background:
        linear-gradient(
          180deg,
          #176a8d,
          #073246
        );

      border-color: #1abaff;

      box-shadow:
        0 0 8px rgba(0,180,255,.4),
        inset 0 0 8px rgba(0,180,255,.25);
    }

    .channel-buttons .small-button {
      min-height: 43px;
      flex: 1;

      background:
        linear-gradient(
          180deg,
          #30434f,
          #0e1a22
        );

      font-size: 11px;
      letter-spacing: .4px;
    }

    /* =========================================================
       METER
       ========================================================= */

    .meter-box {
      min-width: 0;
    }

    .meter-scale {
      display: flex;
      justify-content: space-between;

      gap: 2px;
      margin-bottom: 5px;

      color: #d7e0e7;
      font-size: 9px;
    }

    .led-meter {
      display: grid;

      grid-template-columns:
        repeat(18, minmax(7px, 1fr));

      gap: 3px;

      min-height: 36px;
      padding: 5px;

      border: 1px solid #314752;
      border-radius: 5px;

      background:
        linear-gradient(
          180deg,
          #020609,
          #071015
        );

      box-shadow:
        inset 0 0 10px #000,
        0 0 2px rgba(0,180,255,.25);
    }

    .led-meter span {
      min-width: 7px;
      height: 22px;

      border-radius: 3px;

      background:
        linear-gradient(
          180deg,
          #10201c,
          #07100e
        );

      border: 1px solid #20352d;

      box-shadow:
        inset 0 0 3px #000;
    }

    .led-meter span.on {
      background:
        linear-gradient(
          180deg,
          #75ff9a,
          #0cff4d
        );

      border-color: #a0ffb8;

      box-shadow:
        0 0 5px #20ff65,
        0 0 11px rgba(20,255,80,.65),
        inset 0 0 4px #fff;
    }

    .led-meter span:nth-child(n + 11).on {
      background:
        linear-gradient(
          180deg,
          #fff176,
          #ffc400
        );

      border-color: #fff8a0;

      box-shadow:
        0 0 7px #ffd21c,
        inset 0 0 3px #fff;
    }

    .led-meter span:nth-child(n + 16).on {
      background:
        linear-gradient(
          180deg,
          #ff8b8b,
          #ff2020
        );

      border-color: #ffb0b0;

      box-shadow:
        0 0 8px #ff3030,
        0 0 14px rgba(255,40,40,.6);
    }

    /* =========================================================
       CLIP
       ========================================================= */

    .clip-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      min-width: 55px;

      border: 1px solid #743238;
      border-radius: 6px;

      background:
        linear-gradient(
          180deg,
          #401719,
          #18090b
        );

      box-shadow:
        inset 0 0 10px rgba(255,0,0,.12),
        0 2px 4px #000;
    }

    .clip-led {
      width: 17px;
      height: 17px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #87252a,
          #3b1115
        );

      border: 1px solid #9d3036;
    }

    .clip-led.on {
      background:
        radial-gradient(
          circle at 35% 30%,
          #fff 0 5%,
          #ff7777 18%,
          #ff2020 60%,
          #a40000 100%
        );

      box-shadow:
        0 0 8px #ff3030,
        0 0 20px rgba(255,0,0,.75);
    }

    .clip-text {
      color: #ff7777;
      font-size: 10px;
      font-weight: 900;
    }

    /* =========================================================
       EQ WRAPPER
       ========================================================= */

    .eq-wrapper {
      position: relative;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      margin-top: 10px;
      padding: 8px 4px 10px;

      border: 1px solid #435b68;
      border-radius: 6px;

      background:
        linear-gradient(
          90deg,
          #080f14,
          #17252e 50%,
          #080f14
        );

      box-shadow:
        inset 0 0 15px rgba(0,0,0,.55);

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling: touch;

      overscroll-behavior-x: contain;
      overscroll-behavior-y: none;

      scrollbar-width: auto;
      scrollbar-color: #788792 #151c22;

      /*
       * Horizontal swipe = scroll.
       * Vertical movement = ditangani JS.
       */
      touch-action: pan-x;

      cursor: grab;
    }

    .eq-wrapper:active {
      cursor: grabbing;
    }

    /* =========================================================
       EQ SCALE
       ========================================================= */

    .eq-scale {
      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      width: 100%;
      min-width: 1178px;

      margin-bottom: 4px;

      color: #e0e7ec;
      font-size: 11px;
      font-weight: 800;
    }

    .eq-scale span {
      text-align: center;
    }

    /* =========================================================
       EQ AREA
       ========================================================= */

    .eq-area {
      display: flex;
      flex-direction: row;
      align-items: stretch;

      width: max-content;
      min-width: 1220px;

      gap: 8px;
    }

    /* =========================================================
       dB SCALE
       ========================================================= */

    .db-scale {
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      flex: 0 0 31px;

      width: 31px;
      height: 330px;

      padding: 9px 0 22px;

      color: #e2e9ed;
      font-size: 10px;
      font-weight: 900;
      text-align: right;

      text-shadow: 0 1px 2px #000;

      pointer-events: none;
    }

    /* =========================================================
       31 BANDS
       ========================================================= */

    .bands {
      display: grid;

      grid-template-columns:
        repeat(31, 30px);

      grid-auto-columns: 30px;

      gap: 8px;

      width: max-content;
      min-width: 1178px;

      flex: 0 0 auto;

      align-items: stretch;
    }

    /* =========================================================
       INDIVIDUAL BAND
       ========================================================= */

    .band {
      position: relative;

      width: 30px;
      min-width: 30px;
      max-width: 30px;

      height: 330px;

      padding: 6px 2px 0;

      border: 1px solid #4c606c;
      border-radius: 5px;

      background:
        linear-gradient(
          90deg,
          #091117,
          #1d2a33 48%,
          #091117
        );

      box-shadow:
        inset 1px 0 rgba(255,255,255,.04),
        inset -1px 0 rgba(0,0,0,.8),
        inset 0 0 5px #000;

      flex: 0 0 30px;

      user-select: none;
      -webkit-user-select: none;

      /*
       * Sangat penting:
       * horizontal gesture diberikan kepada browser
       * untuk scroll EQ.
       *
       * vertical gesture diproses oleh JavaScript.
       */
      touch-action: pan-x;

      -webkit-tap-highlight-color: transparent;

      cursor: pointer;
    }

    .band.is-dragging {
      cursor: ns-resize;
    }

    .band:focus-within {
      outline: none;
    }

    /* =========================================================
       BAND TRACK
       ========================================================= */

    .band-track {
      position: absolute;

      top: 12px;
      bottom: 36px;

      left: 50%;

      width: 6px;

      transform: translateX(-50%);

      border-radius: 999px;

      background:
        repeating-linear-gradient(
          to bottom,
          #6d7c85 0,
          #6d7c85 1px,
          transparent 1px,
          transparent 16px
        ),
        linear-gradient(
          90deg,
          #060a0e,
          #53636d,
          #060a0e
        );

      box-shadow:
        inset 0 0 4px #000,
        0 0 0 1px #05080a;

      pointer-events: none;
    }

    /* =========================================================
       FADER LEVEL FILL
       ========================================================= */

    .band-track::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 6px;
      height: var(--fader-level, 50%);

      transform: translateX(-50%);

      border-radius: 999px;

      background:
        linear-gradient(
          to top,
          #18a0ff,
          #49c7ff
        );

      box-shadow:
        0 0 5px #00bfff,
        0 0 10px rgba(0,180,255,.55);

      pointer-events: none;
    }

    /* =========================================================
       NATIVE RANGE
       ========================================================= */

    .band input[type="range"] {
      position: absolute;

      z-index: 5;

      top: 50%;
      left: 50%;

      /*
       * Input diputar -90 derajat.
       * width = panjang gerakan vertikal.
       */
      width: 282px;
      height: 44px;

      margin: 0;

      transform:
        translate(-50%, -50%)
        rotate(-90deg);

      appearance: none;
      -webkit-appearance: none;

      background: transparent;

      cursor: pointer;

      /*
       * Pointer ditangani oleh .band.
       * Native range tetap digunakan untuk keyboard
       * dan sebagai representasi nilai/knob.
       */
      pointer-events: none;

      touch-action: none;
    }

    .band input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;

      border: none;
      border-radius: 999px;

      background: transparent;
    }

    .band input[type="range"]::-moz-range-track {
      height: 6px;

      border: none;
      border-radius: 999px;

      background: transparent;
    }

    .band input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 28px;
      height: 40px;

      margin-top: -17px;

      border: 2px solid rgba(255,255,255,.8);
      border-radius: 6px;

      background:
        linear-gradient(
          to bottom,
          #f5f5f5,
          #aeb6bf
        );

      box-shadow:
        0 2px 5px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.8);

      pointer-events: none;
    }

    .band input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 40px;

      border: 2px solid rgba(255,255,255,.8);
      border-radius: 6px;

      background:
        linear-gradient(
          to bottom,
          #f5f5f5,
          #aeb6bf
        );

      box-shadow:
        0 2px 5px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.8);

      pointer-events: none;
    }

    /* =========================================================
       FREQUENCY / VALUE
       ========================================================= */

    .band-frequency {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      width: max-content;

      color: #e8eef2;

      font-size: 9px;
      line-height: 1;
      font-weight: 900;

      white-space: nowrap;
      text-align: center;

      text-shadow: 0 1px 2px #000;

      pointer-events: none;
    }

    .band-value {
      position: absolute;

      left: 50%;
      bottom: 2px;

      transform: translateX(-50%);

<script>
/* =========================================================
   DBX 2231 GRAPHIC EQUALIZER
   COMPLETE AUDIO ENGINE
   TRUE STEREO L/R
   31 BAND
   REAL TIME METER
   ACTIVE / BYPASS / TEST STATUS
   MASTER SYNC
   ========================================================= */


/* =========================================================
   31 BAND FREQUENCIES
   ========================================================= */

const frequencies = [
  20,
  25,
  31.5,
  40,
  50,
  63,
  80,
  100,
  125,
  160,
  200,
  250,
  315,
  400,
  500,
  630,
  800,
  1000,
  1250,
  1600,
  2000,
  2500,
  3150,
  4000,
  5000,
  6300,
  8000,
  10000,
  12500,
  16000,
  20000
];


/* =========================================================
   DOM
   ========================================================= */

const channelsContainer =
  document.getElementById("channels");

const audioFile =
  document.getElementById("audioFile");

const audioPlayer =
  document.getElementById("audioPlayer");

const inputDevice =
  document.getElementById("inputDevice");

const readyStatus =
  document.getElementById("readyStatus");


/* =========================================================
   AUDIO ENGINE STATE
   ========================================================= */

let audioContext = null;

let masterGainNode = null;

let sourceNode = null;


/*
 * TRUE STEREO NODES
 *
 * stereoInputNode
 *      ↓
 * stereoSplitter
 *   ┌──┴──┐
 *   L    R
 *   ↓    ↓
 *  CH1  CH2
 *   ↓    ↓
 * stereoMerger
 */

let stereoInputNode = null;

let stereoSplitter = null;

let stereoMerger = null;


/*
 * MediaElementSource hanya boleh dibuat satu kali
 * untuk elemen audio yang sama.
 */

let audioFileSourceNode = null;


/*
 * Analyser CH1 / CH2.
 */

let analyserNodes = [];


/*
 * Audio graph CH1 / CH2.
 */

let channelGraphs = [];


/*
 * Microphone stream.
 */

let microphoneStream = null;


/*
 * Master mute.
 */

let isMuted = false;


/*
 * Meter animation.
 */

let meterAnimationId = null;


/*
 * Supaya startMeterAnimation()
 * tidak membuat loop ganda.
 */

let meterAnimationRunning = false;


/* =========================================================
   CHANNEL STATE
   ========================================================= */

const channelState = [

  {
    gain: 0,

    lowCut: false,

    range: 15,

    bypass: false,

    test: false,

    bands: Array(31).fill(0)
  },

  {
    gain: 0,

    lowCut: false,

    range: 15,

    bypass: false,

    test: false,

    bands: Array(31).fill(0)
  }

];


/* =========================================================
   HELPERS
   ========================================================= */

function formatFrequency(freq) {

  if (freq >= 1000) {
    return `${freq / 1000}K`;
  }

  return String(freq);
}


function formatDb(value) {

  const number =
    Number(value);

  if (number > 0) {
    return `+${number.toFixed(1)}`;
  }

  return number.toFixed(1);
}


function dbToGain(db) {

  return Math.pow(
    10,
    db / 20
  );
}


/* =========================================================
   FADER
   ========================================================= */

const FADER_STEP = 0.5;


function clampBandValue(
  channelIndex,
  value
) {

  const range =
    channelState[channelIndex].range;

  let result =
    Number(value);

  if (!Number.isFinite(result)) {
    result = 0;
  }

  result =
    Math.max(
      -range,
      Math.min(
        range,
        result
      )
    );

  result =
    Math.round(
      result / FADER_STEP
    ) * FADER_STEP;

  return result;
}


function calculateFaderPercent(
  channelIndex,
  value
) {

  const range =
    channelState[channelIndex].range;

  if (range <= 0) {
    return 50;
  }

  const percent =
    (
      (Number(value) + range) /
      (range * 2)
    ) * 100;

  return Math.max(
    0,
    Math.min(
      100,
      percent
    )
  );
}


function updateBandVisual(
  channelIndex,
  band,
  value
) {

  const percent =
    calculateFaderPercent(
      channelIndex,
      value
    );

  band.style.setProperty(
    "--fader-level",
    `${percent}%`
  );
}


function setBandValue(
  channelIndex,
  bandIndex,
  value,
  band,
  slider,
  valueLabel
) {

  const safeValue =
    clampBandValue(
      channelIndex,
      value
    );

  channelState[channelIndex]
    .bands[bandIndex] =
    safeValue;

  slider.value =
    String(safeValue);

  valueLabel.textContent =
    formatDb(safeValue);

  updateBandVisual(
    channelIndex,
    band,
    safeValue
  );

  updateChannelAudio(
    channelIndex
  );
}


/* =========================================================
   STATUS LAMP
   ========================================================= */

function updateChannelStatusLights(
  channelIndex
) {

  const channel =
    document.querySelector(
      `.channel[data-channel="${channelIndex}"]`
    );

  if (!channel) {
    return;
  }


  const activeLight =
    channel.querySelector(
      '[data-role="status-active"]'
    );


  const bypassLight =
    channel.querySelector(
      '[data-role="status-bypass"]'
    );


  const testLight =
    channel.querySelector(
      '[data-role="status-test"]'
    );


  const state =
    channelState[channelIndex];


  /*
   * AUDIO ACTIVE
   *
   * ACTIVE hanya ON ketika:
   * - AudioContext running
   * - sourceNode tersedia
   */

  const audioActive =
    !!(
      audioContext &&
      audioContext.state === "running" &&
      sourceNode
    );


  /*
   * TEST
   */

  const testing =
    !!state.test;


  /*
   * ACTIVE
   */

  if (activeLight) {

    activeLight.classList.toggle(
      "active",
      audioActive
    );

  }


  /*
   * BYPASS
   */

  if (bypassLight) {

    bypassLight.classList.toggle(
      "active",
      state.bypass
    );

  }


  /*
   * TEST
   */

  if (testLight) {

    testLight.classList.toggle(
      "active",
      testing
    );

  }

}


/*
 * Update semua lampu channel.
 */

function updateAllStatusLights() {

  channelState.forEach(
    (_, index) => {

      updateChannelStatusLights(
        index
      );

    }
  );

}


/* =========================================================
   CREATE CHANNEL
   ========================================================= */

function createChannel(
  channelIndex
) {

  const channelNumber =
    channelIndex + 1;


  const channel =
    document.createElement(
      "article"
    );


  channel.className =
    "channel";


  channel.dataset.channel =
    channelIndex;


  /* =======================================================
     CHANNEL HTML
     ======================================================= */

  channel.innerHTML = `

    <div class="channel-header">

      <div class="channel-label">

        <span class="power-led"></span>

        ${
          channelNumber === 1
            ? "CH1 — LEFT / L"
            : "CH2 — RIGHT / R"
        }

      </div>

      <div class="channel-status">

        <span
          class="status-light"
          data-role="status-active"
        >
          ACTIVE
        </span>

        <span
          class="status-light bypass"
          data-role="status-bypass"
        >
          BYPASS
        </span>

        <span
          class="status-light test"
          data-role="status-test"
        >
          TEST
        </span>

      </div>

    </div>


    <div class="control-row">


      <!-- GAIN -->

      <div class="control-box">

        <div class="control-title">
          GAIN
        </div>

        <input
          class="gain-slider"
          type="range"
          min="-12"
          max="12"
          step="0.5"
          value="${channelState[channelIndex].gain}"
          data-role="gain"
        />

        <div class="gain-value">

          <span>-12</span>

          <strong data-role="gain-value">
            ${formatDb(
              channelState[channelIndex].gain
            )} dB
          </strong>

          <span>+12</span>

        </div>

      </div>


      <!-- LOW CUT -->

      <div class="control-box">

        <div class="control-title">
          LOW CUT
        </div>

        <button
          class="small-button"
          data-role="lowcut"
          style="width:100%;"
        >
          ${
            channelState[channelIndex].lowCut
              ? "ON / 40 Hz"
              : "OFF / 40 Hz"
          }
        </button>

      </div>


      <!-- RANGE -->

      <div class="control-box">

        <div class="control-title">
          RANGE
        </div>

        <button
          class="small-button"
          data-role="range"
          style="width:100%;"
        >
          ±${channelState[channelIndex].range} dB
        </button>

      </div>


      <!-- LEVEL METER -->

      <div class="control-box meter-box">

        <div class="control-title">
          LEVEL METER
        </div>

        <div class="meter-scale">

          <span>-60</span>
          <span>-40</span>
          <span>-20</span>
          <span>-10</span>
          <span>-6</span>
          <span>-3</span>
          <span>0</span>
          <span>+3</span>

        </div>

        <div
          class="led-meter"
          id="meter-ch${channelNumber}"
          data-role="meter"
        >

          ${Array.from(
            { length: 18 },
            () => "<span></span>"
          ).join("")}

        </div>

      </div>


      <!-- CLIP -->

      <div
        class="clip-box"
        id="clip-ch${channelNumber}"
        data-role="clip"
      >

        <div class="clip-led"></div>

        <div class="clip-text">
          CLIP
        </div>

      </div>

    </div>


    <!-- EQ -->

    <div class="eq-wrapper">

      <div class="eq-scale">

        <span>+15</span>
        <span>+10</span>
        <span>+5</span>
        <span>0</span>
        <span>-5</span>
        <span>-10</span>
        <span>-15</span>

      </div>


      <div class="eq-area">

        <div class="db-scale">

          <span>+15</span>
          <span>+10</span>
          <span>+5</span>
          <span>0</span>
          <span>-5</span>
          <span>-10</span>
          <span>-15</span>

        </div>


        <div
          class="bands"
          data-role="bands"
        ></div>

      </div>

    </div>


    <div class="channel-footer">

      <span>
        31 BAND ISO 1/3 OCTAVE
      </span>

      <span data-role="footer-range">
        RANGE: ±${channelState[channelIndex].range} dB
      </span>

    </div>


    <div class="channel-buttons">

      <button
        class="small-button"
        data-role="bypass"
      >
        BYPASS
      </button>

      <button
        class="small-button"
        data-role="test"
      >
        TEST
      </button>

    </div>

  `;


  /* =======================================================
     INITIAL STATE
     ======================================================= */

  const initialState =
    channelState[channelIndex];


  const lowCutButton =
    channel.querySelector(
      '[data-role="lowcut"]'
    );


  const rangeButton =
    channel.querySelector(
      '[data-role="range"]'
    );


  const bypassButton =
    channel.querySelector(
      '[data-role="bypass"]'
    );


  const testButton =
    channel.querySelector(
      '[data-role="test"]'
    );


  if (lowCutButton) {

    lowCutButton.classList.toggle(
      "active",
      initialState.lowCut
    );

  }


  if (rangeButton) {

    rangeButton.classList.toggle(
      "active",
      initialState.range === 6
    );

  }


  if (bypassButton) {

    bypassButton.classList.toggle(
      "active",
      initialState.bypass
    );

  }


  if (testButton) {

    testButton.classList.toggle(
      "active",
      initialState.test
    );

  }


  const bandsContainer =
    channel.querySelector(
      '[data-role="bands"]'
    );


  /* =======================================================
     CREATE 31 BANDS
     ======================================================= */

  frequencies.forEach(
    (
      frequency,
      bandIndex
    ) => {

      const band =
        document.createElement(
          "div"
        );


      band.className =
        "band";


      const state =
        channelState[channelIndex];


      band.innerHTML = `

        <div class="band-track"></div>

        <input
          type="range"
          min="${-state.range}"
          max="${state.range}"
          step="0.5"
          value="${state.bands[bandIndex]}"
          data-band-index="${bandIndex}"
          aria-label="Channel ${channelNumber}, ${frequency} Hz"
        />

        <div class="band-frequency">
          ${formatFrequency(frequency)}
        </div>

        <div
          class="band-value"
          data-value-index="${bandIndex}"
        >
          ${formatDb(
            state.bands[bandIndex]
          )}
        </div>

      `;


      const slider =
        band.querySelector("input");


      const valueLabel =
        band.querySelector(
          `[data-value-index="${bandIndex}"]`
        );


      updateBandVisual(
        channelIndex,
        band,
        Number(slider.value)
      );


      /* =====================================================
         POINTER STATE
         ===================================================== */

      let pointerMode = null;

      let pointerStartX = 0;

      let pointerStartY = 0;

      let pointerStartValue = 0;

      let pointerMoved = false;

      let pointerActive = false;


      const track =
        band.querySelector(
          ".band-track"
        );


      /* =====================================================
         POINTER DOWN
         ===================================================== */

      band.addEventListener(
        "pointerdown",
        event => {

          if (
            event.target.closest(
              ".band-frequency, .band-value"
            )
          ) {

            return;

          }


          const trackRect =
            track.getBoundingClientRect();


          if (
            event.clientY <
              trackRect.top - 4 ||
            event.clientY >
              trackRect.bottom + 4
          ) {

            return;

          }


          pointerActive = true;

          pointerMode = null;

          pointerMoved = false;

          pointerStartX =
            event.clientX;

          pointerStartY =
            event.clientY;

          pointerStartValue =
            Number(slider.value);

        },
        {
          passive: true
        }
      );


      /* =====================================================
         POINTER MOVE
         ===================================================== */

      band.addEventListener(
        "pointermove",
        event => {

          if (!pointerActive) {
            return;
          }


          const deltaX =
            event.clientX -
            pointerStartX;


          const deltaY =
            event.clientY -
            pointerStartY;


          const absX =
            Math.abs(deltaX);


          const absY =
            Math.abs(deltaY);


          if (
            !pointerMode &&
            (
              absX > 6 ||
              absY > 6
            )
          ) {

            pointerMoved = true;


            if (absX > absY) {

              /*
               * Horizontal = scroll.
               */

              pointerMode =
                "scroll";

              pointerActive =
                false;

              return;

            }


            /*
             * Vertical = fader.
             */

            pointerMode =
              "fader";

            band.classList.add(
              "is-dragging"
            );


            try {

              band.setPointerCapture(
                event.pointerId
              );

            } catch (_) {}

          }


          if (
            pointerMode !==
            "fader"
          ) {

            return;

          }


          event.preventDefault();


          const trackRect =
            track.getBoundingClientRect();


          const trackHeight =
            trackRect.height;


          if (
            trackHeight <= 0
          ) {

            return;

          }


          const range =
            channelState[
              channelIndex
            ].range;


          const valuePerPixel =
            (
              range * 2
            ) /
            trackHeight;


          const newValue =
            pointerStartValue -
            (
              deltaY *
              valuePerPixel
            );


          setBandValue(
            channelIndex,
            bandIndex,
            newValue,
            band,
            slider,
            valueLabel
          );

        },
        {
          passive: false
        }
      );


      /* =====================================================
         POINTER UP
         ===================================================== */

      band.addEventListener(
        "pointerup",
        event => {

          if (!pointerActive) {
            return;
          }


          if (
            pointerMode ===
            "fader"
          ) {

            band.classList.remove(
              "is-dragging"
            );


            try {

              band.releasePointerCapture(
                event.pointerId
              );

            } catch (_) {}


            pointerActive = false;

            pointerMode = null;

            pointerMoved = false;

            return;

          }


          if (
            pointerMode ===
            "scroll"
          ) {

            pointerActive = false;

            pointerMode = null;

            return;

          }


          /*
           * ONE TAP
           */

          if (!pointerMoved) {

            const trackRect =
              track.getBoundingClientRect();


            const currentValue =
              Number(slider.value);


            const range =
              channelState[
                channelIndex
              ].range;


            const trackHeight =
              trackRect.height;


            const currentPercent =
              (
                (currentValue + range) /
                (range * 2)
              );


            const knobY =
              trackRect.bottom -
              (
                currentPercent *
                trackHeight
              );


            const tapY =
              event.clientY;


            const tapThreshold =
              5;


            if (
              tapY <
              knobY -
              tapThreshold
            ) {

              setBandValue(
                channelIndex,
                bandIndex,
                currentValue +
                  FADER_STEP,
                band,
                slider,
                valueLabel
              );

            } else if (
              tapY >
              knobY +
              tapThreshold
            ) {

              setBandValue(
                channelIndex,
                bandIndex,
                currentValue -
                  FADER_STEP,
                band,
                slider,
                valueLabel
              );

            }

          }


          pointerActive = false;

          pointerMode = null;

          pointerMoved = false;

        },
        {
          passive: true
        }
      );


      /* =====================================================
         POINTER CANCEL
         ===================================================== */

      band.addEventListener(
        "pointercancel",
        event => {

          band.classList.remove(
            "is-dragging"
          );


          try {

            if (
              band.hasPointerCapture(
                event.pointerId
              )
            ) {

              band.releasePointerCapture(
                event.pointerId
              );

            }

          } catch (_) {}


          pointerActive = false;

          pointerMode = null;

          pointerMoved = false;

        }
      );


      /* =====================================================
         KEYBOARD
         ===================================================== */

      slider.addEventListener(
        "input",
        () => {

          setBandValue(
            channelIndex,
            bandIndex,
            Number(slider.value),
            band,
            slider,
            valueLabel
          );

        }
      );


      bandsContainer.appendChild(
        band
      );

    }
  );


  /* =======================================================
     GAIN
     ======================================================= */

  const gainSlider =
    channel.querySelector(
      '[data-role="gain"]'
    );


  const gainValue =
    channel.querySelector(
      '[data-role="gain-value"]'
    );


  gainSlider.addEventListener(
    "input",
    () => {

      const value =
        Number(
          gainSlider.value
        );


      channelState[
        channelIndex
      ].gain =
        value;


      gainValue.textContent =
        `${formatDb(value)} dB`;


      updateChannelAudio(
        channelIndex
      );

    }
  );


  /* =======================================================
     LOW CUT
     ======================================================= */

  lowCutButton.addEventListener(
    "click",
    event => {

      const state =
        channelState[channelIndex];


      state.lowCut =
        !state.lowCut;


      event.currentTarget.classList.toggle(
        "active",
        state.lowCut
      );


      event.currentTarget.textContent =
        state.lowCut
          ? "ON / 40 Hz"
          : "OFF / 40 Hz";


      updateChannelAudio(
        channelIndex
      );

    }
  );


  /* =======================================================
     RANGE
     ======================================================= */

  rangeButton.addEventListener(
    "click",
    event => {

      const state =
        channelState[channelIndex];


      state.range =
        state.range === 15
          ? 6
          : 15;


      const range =
        state.range;


      event.currentTarget.textContent =
        `±${range} dB`;


      event.currentTarget.classList.toggle(
        "active",
        range === 6
      );


      const footerRange =
        channel.querySelector(
          '[data-role="footer-range"]'
        );


      if (footerRange) {

        footerRange.textContent =
          `RANGE: ±${range} dB`;

      }


      channel
        .querySelectorAll(
          ".band input"
        )
        .forEach(
          (
            slider,
            index
          ) => {

            let value =
              Number(slider.value);


            value =
              Math.max(
                -range,
                Math.min(
                  range,
                  value
                )
              );


            value =
              Math.round(
                value /
                FADER_STEP
              ) *
              FADER_STEP;


            slider.min =
              String(-range);


            slider.max =
              String(range);


            slider.step =
              String(FADER_STEP);


            slider.value =
              String(value);


            state.bands[index] =
              value;


            const valueLabel =
              channel.querySelector(
                `[data-value-index="${index}"]`
              );


            if (valueLabel) {

              valueLabel.textContent =
                formatDb(value);

            }


            const band =
              slider.closest(
                ".band"
              );


            if (band) {

              updateBandVisual(
                channelIndex,
                band,
                value
              );

            }

          }
        );


      updateChannelAudio(
        channelIndex
      );

    }
  );


  /* =======================================================
     BYPASS
     ======================================================= */

  bypassButton.addEventListener(
    "click",
    event => {

      const state =
        channelState[channelIndex];


      state.bypass =
        !state.bypass;


      event.currentTarget.classList.toggle(
        "active",
        state.bypass
      );


      updateChannelAudio(
        channelIndex
      );


      updateChannelStatusLights(
        channelIndex
      );


      readyStatus.textContent =
        state.bypass
          ? `CH${channelNumber} BYPASS ON`
          : `CH${channelNumber} BYPASS OFF`;

    }
  );


/* =======================================================
   TEST
   ======================================================= */

testButton.addEventListener(
  "click",
  event => {

    const state =
      channelState[channelIndex];

    state.test =
      !state.test;

    const testing =
      state.test;


    event.currentTarget.classList.toggle(
      "active",
      testing
    );


    const meter =
      channel.querySelector(
        '[data-role="meter"]'
      );


    const clip =
      channel.querySelector(
        '[data-role="clip"]'
      );


    /*
     * TEST MODE
     *
     * Meter TEST dibuat dari kanan
     * ke kiri, sama seperti meter audio.
     */

    if (meter) {

      const segments =
        meter.querySelectorAll("span");


      const testLevel =
        testing
          ? 10
          : 0;


      segments.forEach(
        (
          segment,
          index
        ) => {

          const reverseIndex =
            segments.length - 1 - index;


          segment.classList.toggle(
            "on",
            reverseIndex < testLevel
          );

        }
      );

    }


    /*
     * TEST CLIP
     */

    if (clip) {

      const clipLed =
        clip.querySelector(
          ".clip-led"
        );


      if (clipLed) {

        clipLed.classList.toggle(
          "on",
          testing
        );

      }

    }


    updateChannelStatusLights(
      channelIndex
    );


    readyStatus.textContent =
      testing
        ? `CH${channelNumber} TEST ON`
        : `CH${channelNumber} TEST OFF`;

  }
);
  channelsContainer.appendChild(
    channel
  );


  /*
   * Status awal.
   */

  updateChannelStatusLights(
    channelIndex
  );

}

/* =========================================================
   CREATE AUDIO CONTEXT
   ========================================================= */

function createAudioContext() {

  if (audioContext) {

    return;

  }


  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  /* =======================================================
     MASTER
     ======================================================= */

  masterGainNode =
    audioContext.createGain();


  /*
   * Sinkronkan gain audio dengan slider UI.
   *
   * Slider default = -12 dB.
   */

  const masterSlider =
    document.getElementById(
      "masterGain"
    );


  const initialMasterDb =
    masterSlider
      ? Number(masterSlider.value)
      : -12;


  masterGainNode.gain.value =
    isMuted
      ? 0
      : dbToGain(
          initialMasterDb
        );


  /* =======================================================
     STEREO INPUT
     ======================================================= */

  stereoInputNode =
    audioContext.createGain();


  stereoInputNode.gain.value =
    1;


  /*
   * Memastikan sumber mono dapat
   * di-upmix menjadi stereo.
   */

  stereoInputNode.channelCount =
    2;


  stereoInputNode.channelCountMode =
    "explicit";


  stereoInputNode.channelInterpretation =
    "speakers";


  /* =======================================================
     SPLITTER / MERGER
     ======================================================= */

  stereoSplitter =
    audioContext.createChannelSplitter(
      2
    );


  stereoMerger =
    audioContext.createChannelMerger(
      2
    );


  stereoInputNode.connect(
    stereoSplitter
  );


  /* =======================================================
     CHANNEL GRAPHS
     ======================================================= */

  channelGraphs =
    channelState.map(
      (
        state,
        channelIndex
      ) => {

        const inputGain =
          audioContext.createGain();


        /*
         * LOW CUT
         */

        const lowCut =
          audioContext.createBiquadFilter();


        lowCut.type =
          "highpass";


        lowCut.frequency.value =
          state.bypass
            ? 5
            : state.lowCut
              ? 40
              : 5;


        /*
         * 31 BAND EQ
         */

        const filters =
          frequencies.map(
            (
              frequency,
              bandIndex
            ) => {

              const filter =
                audioContext.createBiquadFilter();


              filter.type =
                "peaking";


              filter.frequency.value =
                frequency;


              filter.Q.value =
                1.4;


              filter.gain.value =
                state.bypass
                  ? 0
                  : state.bands[
                      bandIndex
                    ] || 0;


              return filter;

            }
          );


        /*
         * ANALYSER
         */

        const analyser =
          audioContext.createAnalyser();


        analyser.fftSize =
          2048;


        analyser.smoothingTimeConstant =
          0.75;


        /*
         * AUDIO CHAIN
         *
         * Gain
         *   ↓
         * Low Cut
         *   ↓
         * 31 Band EQ
         *   ↓
         * Analyser
         */

        let previousNode =
          inputGain;


        previousNode.connect(
          lowCut
        );


        previousNode =
          lowCut;


        filters.forEach(
          filter => {

            previousNode.connect(
              filter
            );


            previousNode =
              filter;

          }
        );


        previousNode.connect(
          analyser
        );


        /*
         * CH1 → LEFT
         * CH2 → RIGHT
         */

        analyser.connect(
          stereoMerger,
          0,
          channelIndex
        );


        return {

          inputGain,

          lowCut,

          filters,

          analyser

        };

      }
    );


  /* =======================================================
     ANALYSER ARRAY
     ======================================================= */

  analyserNodes =
    channelGraphs.map(
      graph =>
        graph.analyser
    );


  /* =======================================================
     TRUE STEREO ROUTING
     ======================================================= */

  /*
   * CHANNEL 1
   *
   * Splitter output 0 = LEFT
   */

  if (
    channelGraphs[0]
  ) {

    stereoSplitter.connect(
      channelGraphs[0].inputGain,
      0
    );

  }


  /*
   * CHANNEL 2
   *
   * Splitter output 1 = RIGHT
   */

  if (
    channelGraphs[1]
  ) {

    stereoSplitter.connect(
      channelGraphs[1].inputGain,
      1
    );

  }


  /* =======================================================
     STEREO OUTPUT
     ======================================================= */

  stereoMerger.connect(
    masterGainNode
  );


  masterGainNode.connect(
    audioContext.destination
  );


  /*
   * Mulai meter setelah analyser tersedia.
   */

  startMeterAnimation();


  /*
   * Update status.
   */

  updateAllStatusLights();

}


/* =========================================================
   UPDATE CHANNEL AUDIO
   ========================================================= */

function updateChannelAudio(
  channelIndex
) {

  if (
    !channelGraphs[channelIndex]
  ) {

    return;

  }


  const state =
    channelState[
      channelIndex
    ];


  const graph =
    channelGraphs[
      channelIndex
    ];


  /* =======================================================
     CHANNEL GAIN
     ======================================================= */

  /*
   * PENTING:
   *
   * BYPASS TIDAK mengubah gain.
   *
   * Fader tetap aktif.
   */

  graph.inputGain.gain.value =
    dbToGain(
      state.gain
    );


  /* =======================================================
     LOW CUT
     ======================================================= */

  /*
   * BYPASS:
   * Low cut dilewati.
   *
   * OFF:
   * 5 Hz.
   *
   * ON:
   * 40 Hz.
   */

  graph.lowCut.frequency.value =
    state.bypass
      ? 5
      : state.lowCut
        ? 40
        : 5;


  /* =======================================================
     31 BAND EQ
     ======================================================= */

  graph.filters.forEach(
    (
      filter,
      index
    ) => {

      /*
       * BYPASS = semua EQ 0 dB.
       */

      filter.gain.value =
        state.bypass
          ? 0
          : state.bands[index];

    }
  );


  updateChannelStatusLights(
    channelIndex
  );

}


/* =========================================================
   UPDATE ALL AUDIO GRAPHS
   ========================================================= */

function updateAllAudioGraphs() {

  channelState.forEach(
    (
      _,
      index
    ) => {

      updateChannelAudio(
        index
      );

    }
  );

}


/* =========================================================
   DISCONNECT SOURCE
   ========================================================= */

function disconnectCurrentSource() {

  if (!sourceNode) {

    return;

  }


  try {

    sourceNode.disconnect();

  } catch (error) {

    console.warn(
      "Source sudah terputus.",
      error
    );

  }


  sourceNode =
    null;


  updateAllStatusLights();

}


/* =========================================================
   CONNECT SOURCE
   ========================================================= */

function connectSourceToChannels(
  newSource
) {

  disconnectCurrentSource();


  sourceNode =
    newSource;


  /*
   * HANYA source → stereoInputNode.
   *
   * Jangan menghubungkan splitter
   * ke CH1/CH2 di sini.
   *
   * Routing splitter sudah dilakukan
   * sekali di createAudioContext().
   */

  sourceNode.connect(
    stereoInputNode
  );


  updateAllStatusLights();

}


/* =========================================================
   MICROPHONE
   ========================================================= */

async function startMicrophone() {

  createAudioContext();


  if (
    microphoneStream
  ) {

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    microphoneStream =
      null;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "getUserMedia tidak didukung."
    );

  }


  const deviceId =
    inputDevice.value;


  const constraints = {

    audio:
      deviceId
        ? {
            deviceId: {
              exact: deviceId
            }
          }
        : true

  };


  microphoneStream =
    await navigator.mediaDevices
      .getUserMedia(
        constraints
      );


  const micSource =
    audioContext.createMediaStreamSource(
      microphoneStream
    );


  connectSourceToChannels(
    micSource
  );


  await audioContext.resume();


  readyStatus.textContent =
    "MICROPHONE ACTIVE";


  updateAllStatusLights();

}


/* =========================================================
   AUDIO FILE
   ========================================================= */

async function startAudioFile() {

  createAudioContext();


  if (
    !audioPlayer.src
  ) {

    alert(
      "Pilih file audio terlebih dahulu."
    );

    return;

  }


  /*
   * MediaElementSource hanya dibuat
   * satu kali.
   */

  if (
    !audioFileSourceNode
  ) {

    audioFileSourceNode =
      audioContext.createMediaElementSource(
        audioPlayer
      );

  }


  connectSourceToChannels(
    audioFileSourceNode
  );


  await audioContext.resume();


  await audioPlayer.play();


  readyStatus.textContent =
    "AUDIO FILE ACTIVE";


  updateAllStatusLights();

}


/* =========================================================
   STOP AUDIO
   ========================================================= */

function stopAudio() {

  if (
    microphoneStream
  ) {

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    microphoneStream =
      null;

  }


  audioPlayer.pause();


  audioPlayer.currentTime =
    0;


  disconnectCurrentSource();


  readyStatus.textContent =
    "AUDIO STOPPED";


  updateAllStatusLights();

}
/* =========================================================
   REAL TIME METER
   ========================================================= */

function startMeterAnimation() {

  /*
   * Jangan membuat animation loop kedua.
   */

  if (
    meterAnimationRunning
  ) {

    return;

  }


  if (
    !analyserNodes.length
  ) {

    return;

  }


  meterAnimationRunning =
    true;


  const dataArrays =
    analyserNodes.map(
      analyser =>
        new Uint8Array(
          analyser.fftSize
        )
    );


  function drawMeters() {

    meterAnimationId =
      requestAnimationFrame(
        drawMeters
      );


    analyserNodes.forEach(
      (
        analyser,
        channelIndex
      ) => {

        /*
         * Ambil CHANNEL terlebih dahulu.
         *
         * Penting:
         * jangan menggunakan channel sebelum
         * deklarasi ini.
         */

        const channel =
          document.querySelector(
            `.channel[data-channel="${channelIndex}"]`
          );


        if (!channel) {

          return;

        }


        const meter =
          channel.querySelector(
            '[data-role="meter"]'
          );


        const clip =
          channel.querySelector(
            '[data-role="clip"]'
          );


        if (
          !meter ||
          !clip
        ) {

          return;

        }


        const segments =
          meter.querySelectorAll(
            "span"
          );


        /*
         * =====================================================
         * TIDAK ADA INPUT
         * =====================================================
         *
         * Meter harus benar-benar mati.
         *
         * Jangan membaca analyser karena analyser
         * bisa mempunyai noise / nilai kecil walaupun
         * belum ada source.
         */

        if (!sourceNode) {

          segments.forEach(
            segment => {

              segment.classList.remove(
                "on"
              );

            }
          );


          const clipLed =
            clip.querySelector(
              ".clip-led"
            );


          if (clipLed) {

            clipLed.classList.remove(
              "on"
            );

          }


          return;

        }


        const state =
          channelState[
            channelIndex
          ];


        /*
         * =====================================================
         * TEST MODE
         * =====================================================
         *
         * TEST tidak boleh ditimpa oleh
         * analyser audio.
         */

        if (
          state.test
        ) {

          /*
           * Meter TEST tetap berasal dari
           * kanan ke kiri.
           */

          const testLevel =
            10;


          segments.forEach(
            (
              segment,
              index
            ) => {

              const reverseIndex =
                segments.length - 1 - index;


              segment.classList.toggle(
                "on",
                reverseIndex < testLevel
              );

            }
          );


          return;

        }


        /*
         * =====================================================
         * BACA AUDIO
         * =====================================================
         */

        analyser.getByteTimeDomainData(
          dataArrays[
            channelIndex
          ]
        );


        let peak =
          0;


        for (
          let i = 0;
          i <
          dataArrays[
            channelIndex
          ].length;
          i++
        ) {

          const normalized =
            Math.abs(
              dataArrays[
                channelIndex
              ][i] -
              128
            ) /
            128;


          if (
            normalized >
            peak
          ) {

            peak =
              normalized;

          }

        }


        /*
         * =====================================================
         * PEAK dBFS
         * =====================================================
         */

        const db =
          peak > 0
            ? 20 *
              Math.log10(
                peak
              )
            : -60;


        const clampedDb =
          Math.max(
            -60,
            Math.min(
              0,
              db
            )
          );


        /*
         * =====================================================
         * LEVEL
         * =====================================================
         */

        let level =
          0;


        /*
         * Noise di bawah -55 dB
         * dianggap tidak ada sinyal.
         */

        if (
          clampedDb >
          -55
        ) {

          level =
            Math.max(
              0,
              Math.min(
                18,
                Math.round(
                  (
                    (
                      clampedDb +
                      60
                    ) /
                    60
                  ) *
                  18
                )
              )
            );

        }


        /*
         * =====================================================
         * METER KANAN → KIRI
         * =====================================================
         *
         * index 17 = LED paling kanan
         * index 0  = LED paling kiri
         *
         * Jadi sinyal masuk dari kanan.
         */

        segments.forEach(
          (
            segment,
            index
          ) => {

            const reverseIndex =
              segments.length - 1 - index;


            segment.classList.toggle(
              "on",
              reverseIndex < level
            );

          }
        );


        /*
         * =====================================================
         * CLIP
         * =====================================================
         */

        const clipLed =
          clip.querySelector(
            ".clip-led"
          );


        if (clipLed) {

          clipLed.classList.toggle(
            "on",
            peak >= 0.98
          );

        }

      }
    );


    /*
     * ACTIVE / BYPASS / TEST
     */

    updateAllStatusLights();

  }


  drawMeters();

}

/* =========================================================
   RESET
   ========================================================= */

function resetAll() {

  channelState.forEach(
    state => {

      state.gain =
        0;


      state.lowCut =
        false;


      state.range =
        15;


      state.bypass =
        false;


      state.test =
        false;


      state.bands =
        Array(31).fill(0);

    }
  );


  buildChannels();


  updateAllAudioGraphs();


  readyStatus.textContent =
    "RESET COMPLETE";


  updateAllStatusLights();

}


/* =========================================================
   PRESETS
   ========================================================= */

function applyPreset(
  name
) {

  const presets = {

    flat:
      Array(31).fill(0),


    vocal: [
      -3,
      -2,
      -1,
      0,
      1,
      2,
      3,
      3,
      2,
      2,
      1,
      0,
      1,
      2,
      3,
      4,
      4,
      3,
      2,
      2,
      3,
      4,
      4,
      3,
      2,
      1,
      0,
      -1,
      -2,
      -3,
      -3
    ],


    live: [
      3,
      2,
      1,
      0,
      -1,
      -2,
      -2,
      -1,
      0,
      1,
      2,
      3,
      3,
      2,
      1,
      0,
      1,
      2,
      3,
      4,
      4,
      3,
      2,
      1,
      0,
      -1,
      -2,
      -2,
      -1,
      0,
      1
    ],


    feedback: [
      -5,
      -4,
      -3,
      -2,
      -1,
      0,
      -2,
      -4,
      -6,
      -4,
      -2,
      0,
      1,
      0,
      -3,
      -5,
      -4,
      -2,
      0,
      -2,
      -4,
      -5,
      -3,
      -1,
      0,
      -2,
      -4,
      -5,
      -3,
      -2,
      -1
    ]

  };


  const values =
    presets[name] ||
    presets.flat;


  channelState.forEach(
    (
      state,
      channelIndex
    ) => {

      const range =
        state.range;


      state.bands =
        values.map(
          value =>
            Math.max(
              -range,
              Math.min(
                range,
                value
              )
            )
        );


      const channel =
        document.querySelector(
          `.channel[data-channel="${channelIndex}"]`
        );


      if (!channel) {

        return;

      }


      channel
        .querySelectorAll(
          ".band input"
        )
        .forEach(
          (
            slider,
            index
          ) => {

            const value =
              state.bands[index];


            slider.min =
              String(-range);


            slider.max =
              String(range);


            slider.step =
              String(FADER_STEP);


            slider.value =
              String(value);


            const valueLabel =
              channel.querySelector(
                `[data-value-index="${index}"]`
              );


            if (valueLabel) {

              valueLabel.textContent =
                formatDb(value);

            }


            const band =
              slider.closest(
                ".band"
              );


            if (band) {

              updateBandVisual(
                channelIndex,
                band,
                value
              );

            }

          }
        );

    }
  );


  updateAllAudioGraphs();


  readyStatus.textContent =
    `PRESET ${name.toUpperCase()} APPLIED`;

}


/* =========================================================
   LOAD AUDIO DEVICES
   ========================================================= */

async function loadDevices() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.enumerateDevices
  ) {

    return;

  }


  try {

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();


    inputDevice.innerHTML =
      "";


    const audioInputs =
      devices.filter(
        device =>
          device.kind ===
          "audioinput"
      );


    if (
      audioInputs.length === 0
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        "";


      option.textContent =
        "DEFAULT MICROPHONE";


      inputDevice.appendChild(
        option
      );

    }


    audioInputs.forEach(
      device => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          device.deviceId;


        option.textContent =
          device.label ||
          "Audio Input";


        inputDevice.appendChild(
          option
        );

      }
    );

  } catch (error) {

    console.warn(
      "Tidak dapat membaca perangkat audio:",
      error
    );

  }

}

   MIC BUTTON
   ========================================================= */

document
  .getElementById(
    "micButton"

/* =========================================================

document

  )
  .addEventListener(

        );

        );

      }

/* =========================================================
   STOP
   ========================================================= */

document
  .getElementById(
    "stopButton"
  )
  .addEventListener(
    "click",
    stopAudio
  );


/* =========================================================
   REFRESH DEVICES
   ========================================================= */

document
  .getElementById(
    "refreshDevices"
  )
  .addEventListener(

    async () => {

      await loadDevices();


      readyStatus.textContent =

/* =========================================================
   AUDIO FILE
   ========================================================= */

audioFile.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];


    if (!file) {

      return;

    }


    if (
      audioPlayer.dataset.objectUrl
    ) {

      URL.revokeObjectURL(
        audioPlayer.dataset.objectUrl
      );

    }


    const objectUrl =
      URL.createObjectURL(
        file
      );


    audioPlayer.src =
      objectUrl;


    audioPlayer.dataset.objectUrl =
      objectUrl;


    readyStatus.textContent =
      "FILE READY";

  }
);


/* =========================================================
   MASTER GAIN
   ========================================================= */

document
  .getElementById(
    "masterGain"
  )
  .addEventListener(
    "input",
    event => {

      const value =
        Number(
          event.target.value
        );


      document.getElementById(
        "masterValue"
      ).textContent =
        `${value} dB`;


      /*
       * Audio mengikuti slider.
       */

      if (
        masterGainNode
      ) {

        masterGainNode.gain.value =
          isMuted
            ? 0
            : dbToGain(value);

      }

    }
  );


/* =========================================================
   MUTE OUTPUT
   ========================================================= */

document
  .getElementById(
    "muteOutput"
  )
  .addEventListener(
    "click",
    event => {

      isMuted =
        !isMuted;


      event.currentTarget.classList.toggle(
        "active",
        isMuted
      );


      if (
        masterGainNode
      ) {

        const value =
          Number(
            document.getElementById(
              "masterGain"
            ).value
          );


        masterGainNode.gain.value =
          isMuted
            ? 0
            : dbToGain(value);

      }


      event.currentTarget.textContent =
        isMuted
          ? "UNMUTE OUTPUT"
          : "MUTE OUTPUT";


      readyStatus.textContent =
        isMuted
          ? "OUTPUT MUTED"
          : "OUTPUT ACTIVE";

    }
  );


/* =========================================================
   RESET BUTTON
   ========================================================= */

document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    resetAll
  );


/* =========================================================
   APPLY PRESET
   ========================================================= */

document
  .getElementById(
    "applyPresetButton"
  )
  .addEventListener(
    "click",
    () => {

      applyPreset(
        document.getElementById(
          "presetSelect"
        ).value
      );

    }
  );


/* =========================================================
   SAVE
   ========================================================= */

document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    () => {

      const saved =
        JSON.stringify(
          channelState
        );


      localStorage.setItem(
        "dbx2231Preset",
        saved
      );


      readyStatus.textContent =
        "PRESET SAVED";

    }
  );


/* =========================================================
   RECALL
   ========================================================= */

document
  .getElementById(
    "recallButton"
  )
  .addEventListener(
    "click",
    () => {

      const saved =
        localStorage.getItem(
          "dbx2231Preset"
        );


      if (!saved) {

        alert(
          "Belum ada preset yang disimpan."
        );

        return;

      }


      try {

        const data =
          JSON.parse(saved);


        if (
          !Array.isArray(data) ||
          data.length !== 2
        ) {

          throw new Error(
            "Format preset tidak valid."
          );

        }


        data.forEach(
          (
            state,
            index
          ) => {

            const range =
              Number(
                state.range
              ) === 6
                ? 6
                : 15;


            channelState[index] = {

              gain:
                Number.isFinite(
                  Number(state.gain)
                )
                  ? Number(state.gain)
                  : 0,


              lowCut:
                Boolean(
                  state.lowCut
                ),


              range,


              bypass:
                Boolean(
                  state.bypass
                ),


              test:
                Boolean(
                  state.test
                ),


              bands:
                Array.from(
                  {
                    length: 31
                  },
                  (
                    _,
                    bandIndex
                  ) => {

                    const rawValue =
                      Number(
                        state.bands?.[
                          bandIndex
                        ]
                      );


                    const value =
                      Number.isFinite(
                        rawValue
                      )
                        ? rawValue
                        : 0;


                    return Math.max(
                      -range,
                      Math.min(
                        range,
                        Math.round(
                          value /
                          FADER_STEP
                        ) *
                        FADER_STEP
                      )
                    );

                  }
                )

            };

          }
        );


        buildChannels();


        updateAllAudioGraphs();


        readyStatus.textContent =
          "PRESET RECALLED";


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Preset tersimpan rusak atau tidak valid."
        );

      }

    }
  );


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden &&
      audioContext &&
      audioContext.state ===
        "suspended"
    ) {

      audioContext
        .resume()
        .catch(
          () => {}
        );

    }


    updateAllStatusLights();

  }
);


/* =========================================================
   AUDIO CONTEXT STATE
   ========================================================= */

function watchAudioContextState() {

  if (!audioContext) {
    return;
  }


  updateAllStatusLights();

}


/* =========================================================
   CLEANUP OBJECT URL
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      audioPlayer.dataset.objectUrl
    ) {

      try {

        URL.revokeObjectURL(
          audioPlayer.dataset.objectUrl
        );

      } catch (_) {}

    }


    if (
      meterAnimationId
    ) {

      cancelAnimationFrame(
        meterAnimationId
      );

    }

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

buildChannels();

loadDevices();

updateAllStatusLights();


/* =========================================================
   MICROPHONE SUPPORT
   ========================================================= */

if (
  !navigator.mediaDevices?.getUserMedia
) {

  readyStatus.textContent =
    "MICROPHONE NOT SUPPORTED";

}
</script>
