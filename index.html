<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>DBX 2231 Equalizer & Alesis Echo Emulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <!-- =====================================================
         TOP HEADER
         ===================================================== -->
    <header class="top-rack">
      <div class="brand">
        <h1>AUDIO RACK PROCESSOR</h1>
        <p>
          DBX 2231 EQUALIZER & ALESIS ECHO DSP EMULATION
        </p>
      </div>
      <div class="top-actions">
        <button
          class="hardware-button"
          id="saveButton"
          type="button"
        >
          SAVE
        </button>
        <button
          class="hardware-button"
          id="recallButton"
          type="button"
        >
          RECALL
        </button>
        <button
          class="hardware-button"
          id="resetButton"
          type="button"
        >
          RESET
        </button>
      </div>
    </header>
    <!-- =====================================================
         PROCESSOR NAVIGATION
         EQUALIZER TETAP DI INDEX.HTML
         ECHO ALESIS DIPISAH KE ALESIS.HTML
         ===================================================== -->
    <section
      class="device-title"
      style="margin-top:12px;"
    >
      <div
        style="
          width:100%;
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:6px;
        "
      >
        <!-- EQUALIZER AKTIF -->
        <button
          class="hardware-button active"
          id="equalizerNavButton"
          type="button"
          style="
            width:100%;
            min-height:52px;
            font-weight:bold;
            letter-spacing:1px;
            background:linear-gradient(
              180deg,
              #176a8d,
              #073246
            );
            border-color:#1abaff;
          "
        >
          EQUALIZER
        </button>
        <!-- BUKA ALESIS -->
        <button
          class="hardware-button"
          id="alesisNavButton"
          type="button"
          style="
            width:100%;
            min-height:52px;
            font-weight:bold;
            letter-spacing:1px;
          "
        >
          ECHO ALESIS
        </button>
      </div>
    </section>
    <!-- =====================================================
         DBX 2231
         ===================================================== -->
    <section
      class="device-title"
      style="margin-top:8px;"
    >
      <div>
        <div class="device-name">
          DBX 2231
        </div>
        <div class="device-subtitle">
          DUAL CHANNEL GRAPHIC EQUALIZER
          (PROCESSED AFTER ECHO)
        </div>
      </div>
      <div class="preset-area">
        <select
          id="presetSelect"
          class="hardware-select"
        >
          <option value="flat">
            FLAT
          </option>
          <option value="vocal">
            VOKAL CLEAR
          </option>
          <option value="live">
            LIVE BAND
          </option>
          <option value="feedback">
            ANTI-FEEDBACK
          </option>
        </select>
        <button
          class="hardware-button"
          id="applyPresetButton"
          type="button"
        >
          APPLY PRESET
        </button>
      </div>
    </section>
    <!-- =====================================================
         CHANNEL EQUALIZER
         TETAP DI INDEX.HTML
         ===================================================== -->
    <div class="channels-scroll">
      <section
        class="channels"
        id="channels"
      ></section>
    </div>
    <!-- =====================================================
         AUDIO ENGINE & MASTER
         ===================================================== -->
    <section class="audio-engine">
      <div class="section-title">
        AUDIO ENGINE & MASTER OUTPUT
      </div>
      <div class="engine-grid">
        <!-- INPUT -->
        <div class="engine-box">
          <div class="engine-label">
            INPUT DEVICE / AUDIO FILE
          </div>
          <div class="engine-controls">
            <select
              class="hardware-select"
              id="inputDevice"
            >
              <option value="">
                DEFAULT MICROPHONE
              </option>
            </select>
            <button
              class="hardware-button"
              id="refreshDevices"
              type="button"
            >
              REFRESH
            </button>
          </div>
          <br />
          <input
            class="file-input"
            id="audioFile"
            type="file"
            accept="audio/*"
            multiple
          >
        </div>
        <!-- AUDIO CONTROL -->
        <div class="engine-box">
          <div class="engine-label">
            AUDIO CONTROL
          </div>
          <div class="engine-controls">
            <button
              class="hardware-button"
              id="micButton"
              type="button"
            >
              MIC INPUT
            </button>
            <button
              class="hardware-button"
              id="startButton"
              type="button"
            >
              START AUDIO
            </button>
            <button
              class="hardware-button"
              id="stopButton"
              type="button"
            >
              STOP AUDIO
            </button>
          </div>
          <audio
            id="audioPlayer"
            controls
            style="
              width:100%;
              margin-top:10px;
            "
          ></audio>
        </div>
        <!-- MASTER -->
        <div class="engine-box">
          <div class="engine-label">
            MASTER OUTPUT
          </div>
          <div class="master-row">
            <input
              id="masterGain"
              type="range"
              min="-30"
              max="0"
              step="0.5"
              value="-12"
            />
            <div
              class="master-value"
              id="masterValue"
            >
              -12 dB
            </div>
          </div>
          <br />
          <button
            class="hardware-button"
            id="muteOutput"
            type="button"
          >
            MUTE OUTPUT
          </button>
        </div>
      </div>
    </section>
    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <footer class="footer">
      <div>
        DBX 2231 & ALESIS WEB EMULATOR • Web Audio API
      </div>
      <div
        class="ready"
        id="readyStatus"
      >
        READY
      </div>
    </footer>
  </main>
  <!-- =====================================================
       SCRIPT
       ===================================================== -->
  <script src="js/audio-engine.js"></script>
  <script src="js/echo-alesis.js"></script>
  <script src="js/equalizer.js"></script>
  <!-- =====================================================
       NAVIGATION
       ===================================================== -->
  <script>
    document.addEventListener(
      "DOMContentLoaded",
      function () {
        const equalizerNavButton =
          document.getElementById(
            "equalizerNavButton"
          );
        const alesisNavButton =
          document.getElementById(
            "alesisNavButton"
          );
        /*
         * ===================================================
         * EQUALIZER
         * ===================================================
         *
         * Equalizer memang berada di index.html.
         *
         * Tidak membuka halaman baru.
         */
        if (equalizerNavButton) {
          equalizerNavButton.addEventListener(
            "click",
            function () {
              window.scrollTo({
                top: 0,
                behavior: "smooth"
              });
            }
          );
        }
        /*
         * ===================================================
         * ECHO ALESIS
         * ===================================================
         *
         * Gunakan NAMA WINDOW TETAP.
         *
         * BUKAN "_blank".
         *
         * Hasilnya:
         *
         * Klik pertama:
         *     buka alesis.html
         *
         * Klik kedua:
         *     gunakan kembali tab Alesis
         *
         * Klik ketiga:
         *     tetap tab yang sama
         *
         * Jadi tidak membuat banyak tab Chrome.
         * ===================================================
         */
        if (alesisNavButton) {
          alesisNavButton.addEventListener(
            "click",
            function () {
              let alesisWindow = null;
              try {
                alesisWindow =
                  window.open(
                    "alesis.html",
                    "ALESIS_DSP_WINDOW"
                  );
              }
              catch (error) {
                console.error(
                  "Gagal membuka Alesis:",
                  error
                );
              }
              /*
               * Fokuskan kembali tab Alesis.
               */
              if (
                alesisWindow
              ) {
                try {
                  alesisWindow.focus();
                }
                catch (_) {}
              }
            }
          );
        }
      }
    );
  </script>
</body>
</html>
