<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Equalizer Online</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <main id="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="top-rack">

      <div class="brand">

        <h1>
          EQUALIZER ONLINE
        </h1>

        <p>
          AUDIO PROCESSOR • ECHO • 31 BAND EQUALIZER
        </p>

      </div>

    </header>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <nav class="page-navigation">

      <button
        type="button"
        class="page-button active"
        data-page="equalizer"
      >
        1. EQUALIZER
      </button>

      <button
        type="button"
        class="page-button"
        data-page="echo"
      >
        2. ECHO ALESIS
      </button>

    </nav>


    <!-- =====================================================
         PAGE CONTAINER
         ===================================================== -->

    <main id="pageContainer">

      <!--
        equalizer.js akan memasukkan
        halaman DBX 2231 di sini.
      -->

    </main>


    <!-- =====================================================
         GLOBAL AUDIO ENGINE
         ===================================================== -->

    <section
      class="audio-engine"
      id="globalAudioEngine"
    >

      <div class="section-title">
        AUDIO ENGINE
      </div>

      <div class="engine-grid">

        <!-- INPUT -->

        <div class="engine-box">

          <div class="engine-label">
            INPUT DEVICE / AUDIO FILE
          </div>

          <div class="engine-controls">

            <select
              class="hardware-select"
              id="inputDevice"
            >

              <option value="">
                DEFAULT MICROPHONE
              </option>

            </select>

            <button
              class="hardware-button"
              id="refreshDevices"
              type="button"
            >
              REFRESH
            </button>

          </div>

          <br>

          <input
            class="file-input"
            id="audioFile"
            type="file"
            accept="audio/*"
            multiple
          >

        </div>


        <!-- AUDIO CONTROL -->

        <div class="engine-box">

          <div class="engine-label">
            AUDIO CONTROL
          </div>

          <div class="engine-controls">

            <button
              class="hardware-button"
              id="micButton"
              type="button"
            >
              MIC INPUT
            </button>

            <button
              class="hardware-button"
              id="startButton"
              type="button"
            >
              START AUDIO
            </button>

            <button
              class="hardware-button"
              id="stopButton"
              type="button"
            >
              STOP AUDIO
            </button>

          </div>

          <audio
            id="audioPlayer"
            controls
            preload="metadata"
          ></audio>

          <div
            id="currentAudioName"
            class="current-audio-name"
          >
            NO AUDIO SELECTED
          </div>

          <div
            id="playlistCount"
            class="playlist-count"
          >
            PLAYLIST: 0 FILE
          </div>

          <div
            id="audioPlaylist"
            class="audio-playlist"
          >
            <div class="playlist-empty">
              BELUM ADA FILE AUDIO
            </div>
          </div>

          <div class="playlist-buttons">

            <button
              class="small-button"
              id="previousAudio"
              type="button"
            >
              ◀ PREV
            </button>

            <button
              class="small-button"
              id="playSelectedAudio"
              type="button"
            >
              ▶ PLAY
            </button>

            <button
              class="small-button"
              id="nextAudio"
              type="button"
            >
              NEXT ▶
            </button>

            <button
              class="small-button"
              id="clearPlaylist"
              type="button"
            >
              CLEAR
            </button>

          </div>

        </div>


        <!-- MASTER -->

        <div class="engine-box">

          <div class="engine-label">
            MASTER OUTPUT
          </div>

          <div class="master-row">

            <input
              id="masterGain"
              type="range"
              min="-30"
              max="0"
              step="0.5"
              value="-12"
            >

            <div
              class="master-value"
              id="masterValue"
            >
              -12 dB
            </div>

          </div>

          <br>

          <button
            class="hardware-button"
            id="muteOutput"
            type="button"
          >
            MUTE OUTPUT
          </button>

        </div>

      </div>

    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

      <div>
        EQUALIZER ONLINE • WEB AUDIO API
      </div>

      <div
        class="ready"
        id="readyStatus"
      >
        READY
      </div>

    </footer>

  </main>


  <!-- =======================================================
       JAVASCRIPT
       URUTAN PENTING
       ======================================================= -->

  <script src="js/audio-engine.js"></script>

  <script src="js/echo-alesis.js"></script>

  <script src="js/equalizer.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
