<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GQX-3102 Equalizer & Audio Console Online</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0c0f15; color: #fff; margin: 0; padding: 10px; }
    .app { max-width: 800px; margin: 0 auto; }
    .panel { background: #161a22; border: 1px solid #3a414b; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    h2 { font-size: 14px; color: #38bdf8; margin-top: 0; }
    button, select, input { background: #252b35; color: #fff; border: 1px solid #485260; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 4px 0; }
    button:hover { background: #334155; }
    button.active { background: #10b981; color: #000; border-color: #34d399; }
    .status { font-size: 11px; color: #94a3b8; margin-top: 6px; }
    .eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 4px; margin-top: 10px; }
    .band { display: flex; flex-direction: column; align-items: center; font-size: 8px; background: #101216; padding: 4px; border-radius: 4px; }
    .band input { writing-mode: vertical-lr; direction: rtl; width: 14px; height: 120px; accent-color: #38bdf8; }
  </style>
</head>
<body>

  <main class="app">
    <!-- PANEL KONTROL UTAMA & AUDIO PLAYER -->
    <section class="panel">
      <h2>1. AUDIO ENGINE & PLAYBACK (DIJAMIN KELUAR DI HP)</h2>
      <p style="font-size: 11px; color: #94a3b8;">Pilih file musik Anda, lalu tekan tombol PLAY. Pastikan Volume HP Anda tidak dalam posisi mute.</p>
      
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
        <button onclick="document.getElementById('audioFileInput').click()">📁 PILIH FILE AUDIO</button>
        <button id="playButton" style="background: #10b981; color: #000;">▶️ PLAY AUDIO</button>
        <button id="stopButton" style="background: #ef4444; color: #fff;">⏹️ STOP</button>
      </div>
      <div id="fileNameDisplay" style="font-size: 11px; color: #f59e0b; margin-top: 6px;">Belum ada file dipilih.</div>
      <div id="audioStatus" class="status">Status Audio: Menunggu interaksi pengguna.</div>
    </section>

    <!-- PANEL ALESIS FX (ECHO / REVERB) -->
    <section class="panel">
      <h2>2. ALESIS FX PROCESSOR</h2>
      <button id="fxToggleBtn">ALESIS FX: OFF</button>
      <div style="display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap;">
        <div>
          <label style="font-size: 10px; display:block;">Delay Time: <span id="valDelay">0.3s</span></label>
          <input type="range" id="rangeDelay" min="0.05" max="1.0" step="0.05" value="0.3">
        </div>
        <div>
          <label style="font-size: 10px; display:block;">Feedback: <span id="valFeedback">40%</span></label>
          <input type="range" id="rangeFeedback" min="0.0" max="0.8" step="0.05" value="0.4">
        </div>
      </div>
    </section>

    <!-- PANEL EQUALIZER GQX-3102 -->
    <section class="panel">
      <h2>3. GQX-3102 EQUALIZER (CH 1)</h2>
      <button onclick="setFlat()">FLAT EQ</button>
      <div class="eq-grid" id="eqContainer"></div>
    </section>
  </main>

  <script>
    "use strict";

    let audioCtx = null;
    let audioBuffer = null;
    let sourceNode = null;
    let isPlaying = false;

    // Node Audio Web Audio API
    let inputGainNode = null;
    let alesisDelayNode = null;
    let alesisFeedbackNode = null;
    let alesisWetNode = null;
    let alesisDryNode = null;
    let masterOutputNode = null;
    let eqFilters = [];

    let isFxEnabled = false;

    // Frekuensi Equalizer Grafik 31-Band Sederhana
    const frequencies = [63, 100, 160, 250, 400, 630, 1000, 1600, 2500, 4000, 6300, 10000];

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function buildAudioGraph() {
      if (audioCtx && masterOutputNode) return; // Sudah dibuat

      initAudioContext();

      inputGainNode = audioCtx.createGain();
      masterOutputNode = audioCtx.createGain();
      masterOutputNode.gain.value = 0.8; // Volume aman

      // Buat Filter Equalizer
      let prevNode = inputGainNode;
      eqFilters = frequencies.map(freq => {
        let filter = audioCtx.createBiquadFilter();
        filter.type = "peaking";
        filter.frequency.value = freq;
        filter.Q.value = 1.4;
        filter.gain.value = 0;
        prevNode.connect(filter);
        prevNode = filter;
        return filter;
      });

      // Alesis FX Nodes
      alesisDelayNode = audioCtx.createDelay(2.0);
      alesisDelayNode.delayTime.value = 0.3;
      alesisFeedbackNode = audioCtx.createGain();
      alesisFeedbackNode.gain.value = 0.4;
      alesisWetNode = audioCtx.createGain();
      alesisWetNode.gain.value = 0.3;
      alesisDryNode = audioCtx.createGain();
      alesisDryNode.gain.value = 0.7;

      // Routing Feedback Loop Alesis
      alesisDelayNode.connect(alesisFeedbackNode);
      alesisFeedbackNode.connect(alesisDelayNode);

      updateRouting();
    }

    function updateRouting() {
      if (!audioCtx) return;

      // Putuskan koneksi sebelumnya untuk mencegah konflik
      try {
        eqFilters[eqFilters.length - 1].disconnect();
        alesisDryNode.disconnect();
        alesisWetNode.disconnect();
        alesisDelayNode.disconnect(alesisWetNode);
      } catch (e) {}

      let lastEqNode = eqFilters[eqFilters.length - 1];

      if (isFxEnabled) {
        lastEqNode.connect(alesisDryNode);
        alesisDryNode.connect(masterOutputNode);

        lastEqNode.connect(alesisDelayNode);
        alesisDelayNode.connect(alesisWetNode);
        alesisWetNode.connect(masterOutputNode);
      } else {
        lastEqNode.connect(masterOutputNode);
      }

      // Pastikan ujung rantai terhubung ke speaker perangkat HP (destination)
      masterOutputNode.connect(audioCtx.destination);
    }

    // Bangun UI Slider Equalizer
    const eqContainer = document.getElementById("eqContainer");
    frequencies.forEach((freq, idx) => {
      const div = document.createElement("div");
      div.className = "band";
      div.innerHTML = `
        <span>${freq}Hz</span>
        <input type="range" min="-15" max="15" step="0.5" value="0" data-index="${idx}">
        <span class="val">0dB</span>
      `;
      const slider = div.querySelector("input");
      const valLabel = div.querySelector(".val");

      slider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        valLabel.textContent = val + "dB";
        if (eqFilters[idx] && audioCtx) {
          eqFilters[idx].gain.setValueAtTime(val, audioCtx.currentTime);
        }
      });
      eqContainer.appendChild(div);
    });

    function setFlat() {
      document.querySelectorAll("#eqContainer input").forEach((inp, idx) => {
        inp.value = 0;
        inp.nextElementSibling.textContent = "0dB";
        if (eqFilters[idx]) eqFilters[idx].gain.value = 0;
      });
    }

    // Handler Tombol Alesis FX
    const fxToggleBtn = document.getElementById("fxToggleBtn");
    fxToggleBtn.addEventListener("click", () => {
      isFxEnabled = !isFxEnabled;
      fxToggleBtn.textContent = isFxEnabled ? "ALESIS FX: ON" : "ALESIS FX: OFF";
      fxToggleBtn.classList.toggle("active", isFxEnabled);
      updateRouting();
    });

    document.getElementById("rangeDelay").addEventListener("input", (e) => {
      document.getElementById("valDelay").textContent = e.target.value + "s";
      if (alesisDelayNode && audioCtx) alesisDelayNode.delayTime.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
    });

    document.getElementById("rangeFeedback").addEventListener("input", (e) => {
      document.getElementById("valFeedback").textContent = Math.round(e.target.value * 100) + "%";
      if (alesisFeedbackNode && audioCtx) alesisFeedbackNode.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
    });

    // Membaca File Audio dengan FileReader (Metode Paling Ampuh untuk HP)
    document.getElementById("audioFileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById("fileNameDisplay").textContent = "File: " + file.name;
      document.getElementById("audioStatus").textContent = "Mendecode file audio...";

      initAudioContext();
      buildAudioGraph();

      try {
        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        document.getElementById("audioStatus").textContent = "Audio siap diputar! Silakan tekan tombol PLAY.";
      } catch (err) {
        document.getElementById("audioStatus").textContent = "Gagal mendecode file audio.";
      }
    });

    // Tombol Play
    document.getElementById("playButton").addEventListener("click", () => {
      if (!audioBuffer) {
        alert("Harap pilih file audio terlebih dahulu lewat tombol 'PILIH FILE AUDIO'!");
        return;
      }

      initAudioContext();
      buildAudioGraph();

      if (sourceNode) {
        try { sourceNode.stop(); } catch (e) {}
      }

      // Buat sumber buffer baru
      sourceNode = audioCtx.createBufferSource();
      sourceNode.buffer = audioBuffer;

      // Hubungkan sumber suara langsung ke Input Equalizer -> Alesis FX -> Master -> Speaker HP
      sourceNode.connect(inputGainNode);

      sourceNode.start(0);
      isPlaying = true;
      document.getElementById("audioStatus").textContent = "Memutar audio ke speaker HP...";

      sourceNode.onended = () => {
        isPlaying = false;
        document.getElementById("audioStatus").textContent = "Pemutaran selesai.";
      };
    });

    // Tombol Stop
    document.getElementById("stopButton").addEventListener("click", () => {
      if (sourceNode) {
        try { sourceNode.stop(); } catch (e) {}
        sourceNode = null;
      }
      isPlaying = false;
      document.getElementById("audioStatus").textContent = "Audio dihentikan.";
    });
  </script>
</body>
</html>
